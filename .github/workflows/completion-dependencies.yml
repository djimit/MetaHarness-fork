name: Completion service dependencies
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  completion-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/apicompletions
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test
